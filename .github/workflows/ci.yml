name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build (debug)
        run: swift build -c debug

      - name: Run tests
        run: swift test

      - name: Build (release)
        run: swift build -c release
